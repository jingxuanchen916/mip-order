# Prompt templates, all as used in the paper; the comment after each name gives
# its name in the paper.
#
# A single-call prompt is: template, a blank line, then "Instance 1: <text>",
# "Instance 2: <text>", ... separated by blank lines (see run.py).
# To add a single-call variant, add a top-level entry with one template per task;
# run.py --prompt <name> picks it up.

standard:  # Standard
  math: |
    Task: Determine the majority parity label among the final answers to all provided math problems.

    Instructions:
    - Solve each math problem independently.
    - Determine whether each final answer is even or odd.
    - Count how many instances belong to each label.
    - Choose exactly one label from: "even_number", "odd_number".
    - If the counts are tied, answer -1.
    - Return only a JSON object with the field "answer".

    Example response format:
    {"answer": "odd_number"}

    End your response with the JSON object containing your final answer.
  ner: |
    Task: Determine the majority entity-type label among all provided instances.

    Instructions:
    - Classify each instance independently as containing a person entity (PER) or a location entity (LOC).
    - Count how many instances belong to each label.
    - Choose exactly one label from: "LOC", "PER".
    - If the counts are tied, answer -1.
    - Return only a JSON object with the field "answer".

    Example response format:
    {"answer": "PER"}

    End your response with the JSON object containing your final answer.
  occurrence: |
    Task: Determine the majority occurrence label for the exact word "the" among all provided instances.

    Instructions:
    - For each instance, count the word "the" case-insensitively, for examples, "the", "The", and "THE" all count.
    - Count only the standalone word "the", do not count "the" when it appears as part of another word, such as "they", "there", or "other".
    - Classify each instance as exactly once or more than once.
    - Count how many instances belong to each label.
    - Choose exactly one label from: "more_than_once", "exactly_once".
    - If the counts are tied, answer -1.
    - Return only a JSON object with the field "answer".

    Example response format:
    {"answer": "exactly_once"}

    End your response with the JSON object containing your final answer.
  sentiment: |
    Task: Determine the majority sentiment label among all provided instances.

    Instructions:
    - Classify each instance independently as positive or negative.
    - Count how many instances belong to each label.
    - Choose exactly one label from: "negative", "positive".
    - If the counts are tied, answer -1.
    - Return only a JSON object with the field "answer".

    Example response format:
    {"answer": "positive"}

    End your response with the JSON object containing your final answer.
  wsd: |
    Task: Determine the majority sense of the word "java" among all provided instances.

    Instructions:
    - Classify each instance independently as using "java" to mean a place or a programming language.
    - Count how many instances belong to each label.
    - Choose exactly one label from: "place", "programming_language".
    - If the counts are tied, answer -1.
    - Return only a JSON object with the field "answer".

    Example response format:
    {"answer": "programming_language"}

    End your response with the JSON object containing your final answer.

